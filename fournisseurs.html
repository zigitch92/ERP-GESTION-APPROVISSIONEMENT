<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fichier fournisseur - COSIDER</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #222;
        }

        .header {
            background: #0b3d6e;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
        }

        .back {
            background: white;
            color: #0b3d6e;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            padding: 30px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            padding: 11px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-btn {
            background: #198754;
            color: white;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
        }

        .search {
            padding: 11px;
            width: 280px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .table-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th {
            background: #0b3d6e;
            color: white;
            padding: 13px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f1f5f9;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            width: 600px;
            max-width: 100%;
            padding: 30px;
            border-radius: 12px;
        }

        .modal-content h2 {
            color: #0b3d6e;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .full {
            grid-column: 1 / 3;
        }

        .modal-buttons {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .save-btn {
            background: #0b3d6e;
            color: white;
        }

        .cancel-btn {
            background: #6c757d;
            color: white;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: 1;
            }
        }
    
.export-btn,.import-btn{padding:10px 14px;border:none;border-radius:6px;cursor:pointer;font-weight:bold;margin-left:8px;background:#fff;border:1px solid #d5dce5;color:#123;}
.export-btn:hover,.import-btn:hover{background:#f1f5f9;}
</style>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>

<body>

    <header class="header">
        <h1>📁 Fichier fournisseur</h1>

        <button class="back" onclick="window.location.href='dashboard.html'">
            ← Retour au Dashboard
        </button>
    </header>

    <main class="container">

        <div class="top-bar">

            <div class="buttons">
                <button class="export-btn" onclick="exporterFournisseursExcel()">↥ Exporter Excel</button>
                <button class="import-btn" onclick="document.getElementById('importFournisseursExcel').click()">📥 Importer Excel</button>
                <input type="file" id="importFournisseursExcel" accept=".xlsx,.xls,.csv" style="display:none" onchange="importerFournisseursExcel(this)">

<button class="add-btn" onclick="ouvrirFormulaire()">
                    + Ajouter un fournisseur
                </button>

                <button class="delete-btn" onclick="supprimerFournisseur()">
                    🗑 Supprimer
                </button>
            </div>

            <input
                type="text"
                id="recherche"
                class="search"
                placeholder="🔍 Rechercher un fournisseur..."
                onkeyup="rechercherFournisseur()"
            >

        </div>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>Sélection</th>
                        <th>Société</th>
                        <th>Nature</th>
                        <th>Sous-nature</th>
                        <th>RC</th>
                        <th>NIF</th>
                        <th>NIS</th>
                        <th>N° Article</th>
                        <th>Wilaya</th>
                    </tr>
                </thead>

                <tbody id="listeFournisseurs">
                </tbody>

            </table>

        </div>

    </main>


    <!-- FORMULAIRE AJOUT FOURNISSEUR -->

    <div class="modal" id="modal">

        <div class="modal-content">

            <h2>Ajouter un fournisseur</h2>

            <div class="form-grid">

                <div class="form-group full">
                    <label>Société</label>
                    <input type="text" id="societe" placeholder="Nom de la société">
                </div>

                <div class="form-group">
                    <label>Nature</label>

                    <select id="nature">
                        <option value="">-- Choisir --</option>
                        <option value="Fourniture">Fourniture</option>
                        <option value="Prestation">Prestation</option>
                        <option value="Location">Location</option>
                        <option value="Travaux">Travaux</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Sous-nature</label>
                    <input
                        type="text"
                        id="sousNature"
                        placeholder="Ex : Gasoil"
                    >
                </div>

                <div class="form-group">
                    <label>N° Registre de commerce</label>
                    <input type="text" id="rc">
                </div>

                <div class="form-group">
                    <label>NIF</label>
                    <input type="text" id="nif">
                </div>

                <div class="form-group">
                    <label>NIS</label>
                    <input type="text" id="nis">
                </div>

                <div class="form-group">
                    <label>N° Article</label>
                    <input type="text" id="article">
                </div>

                <div class="form-group">
                    <label>Wilaya</label>
                    <input
                        type="text"
                        id="wilaya"
                        placeholder="Ex : Alger"
                    >
                </div>

            </div>

            <div class="modal-buttons">

                <button class="cancel-btn" onclick="fermerFormulaire()">
                    Annuler
                </button>

                <button class="save-btn" onclick="ajouterFournisseur()">
                    Enregistrer
                </button>

            </div>

        </div>

    </div>


    <script>

        let fournisseurs = JSON.parse(
            localStorage.getItem("fournisseurs")
        ) || [];


        function afficherFournisseurs(liste = fournisseurs) {

            const tableau = document.getElementById("listeFournisseurs");

            tableau.innerHTML = "";

            liste.forEach((fournisseur, index) => {

                tableau.innerHTML += `
                    <tr>
                        <td>
                            <input
                                type="checkbox"
                                class="fournisseur-check"
                                data-index="${index}"
                            >
                        </td>

                        <td>${fournisseur.societe}</td>

                        <td>${fournisseur.nature}</td>

                        <td>${fournisseur.sousNature}</td>

                        <td>${fournisseur.rc}</td>

                        <td>${fournisseur.nif}</td>

                        <td>${fournisseur.nis}</td>

                        <td>${fournisseur.article}</td>

                        <td>${fournisseur.wilaya}</td>
                    </tr>
                `;
            });
        }


        function ouvrirFormulaire() {
            document.getElementById("modal").style.display = "flex";
        }


        function fermerFormulaire() {
            document.getElementById("modal").style.display = "none";
        }


        function ajouterFournisseur() {

            const fournisseur = {

                societe: document.getElementById("societe").value.trim(),

                nature: document.getElementById("nature").value,

                sousNature: document.getElementById("sousNature").value.trim(),

                rc: document.getElementById("rc").value.trim(),

                nif: document.getElementById("nif").value.trim(),

                nis: document.getElementById("nis").value.trim(),

                article: document.getElementById("article").value.trim(),

                wilaya: document.getElementById("wilaya").value.trim()
            };


            if (!fournisseur.societe || !fournisseur.nature) {

                alert("Veuillez renseigner au minimum la société et la nature.");

                return;
            }


            fournisseurs.push(fournisseur);


            localStorage.setItem(
                "fournisseurs",
                JSON.stringify(fournisseurs)
            );


            afficherFournisseurs();

            fermerFormulaire();

            document.querySelectorAll(".modal input").forEach(input => {
                input.value = "";
            });

            document.getElementById("nature").value = "";

        }


        function supprimerFournisseur() {

            const cases = document.querySelectorAll(
                ".fournisseur-check:checked"
            );


            if (cases.length === 0) {

                alert("Sélectionnez au moins un fournisseur à supprimer.");

                return;
            }


            if (!confirm("Voulez-vous vraiment supprimer le fournisseur sélectionné ?")) {
                return;
            }


            const indices = Array.from(cases)

                .map(c => Number(c.dataset.index))

                .sort((a, b) => b - a);


            indices.forEach(index => {
                fournisseurs.splice(index, 1);
            });


            localStorage.setItem(
                "fournisseurs",
                JSON.stringify(fournisseurs)
            );


            afficherFournisseurs();

        }


        function rechercherFournisseur() {

            const recherche = document
                .getElementById("recherche")
                .value
                .toLowerCase();


            const resultat = fournisseurs.filter(fournisseur =>

                fournisseur.societe.toLowerCase().includes(recherche) ||

                fournisseur.nature.toLowerCase().includes(recherche) ||

                fournisseur.sousNature.toLowerCase().includes(recherche) ||

                fournisseur.wilaya.toLowerCase().includes(recherche)

            );


            afficherFournisseurs(resultat);
        }


        afficherFournisseurs();

    </script>


<script>
function normaliserEnteteFournisseur(v){
    return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
}
function valeurFournisseur(row, aliases){
    const keys=Object.keys(row); const wanted=aliases.map(normaliserEnteteFournisseur);
    const k=keys.find(x=>wanted.includes(normaliserEnteteFournisseur(x)));
    return k!==undefined ? (row[k]??'') : '';
}
function exporterFournisseursExcel(){
    const rows=fournisseurs.map(f=>({
        'Société':f.societe||'', 'Nature':f.nature||'', 'Sous-nature':f.sousNature||'',
        'RC':f.rc||'', 'NIF':f.nif||'', 'NIS':f.nis||'', 'N° Article':f.article||'', 'Wilaya':f.wilaya||''
    }));
    const ws=XLSX.utils.json_to_sheet(rows); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Fournisseurs');
    XLSX.writeFile(wb,'fournisseurs.xlsx');
}
function importerFournisseursExcel(input){
    const file=input.files&&input.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=e=>{
        try{
            const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'}); const ws=wb.Sheets[wb.SheetNames[0]];
            const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
            const importes=rows.map(r=>({
                societe:String(valeurFournisseur(r,['Société','Societe','Nom','Raison sociale'])).trim(),
                nature:String(valeurFournisseur(r,['Nature'])).trim(),
                sousNature:String(valeurFournisseur(r,['Sous-nature','Sous nature','SousNature'])).trim(),
                rc:String(valeurFournisseur(r,['RC','Registre commerce'])).trim(),
                nif:String(valeurFournisseur(r,['NIF'])).trim(),
                nis:String(valeurFournisseur(r,['NIS'])).trim(),
                article:String(valeurFournisseur(r,['N° Article','Article','N Article'])).trim(),
                wilaya:String(valeurFournisseur(r,['Wilaya'])).trim()
            })).filter(f=>f.societe||f.nature||f.rc||f.nif||f.nis||f.wilaya);
            if(!importes.length){alert('Aucun fournisseur reconnu dans ce fichier Excel.');return;}
            fournisseurs.push(...importes); localStorage.setItem('fournisseurs',JSON.stringify(fournisseurs)); afficherFournisseurs();
            alert(importes.length+' fournisseur(s) importé(s).');
        }catch(err){console.error(err);alert('Impossible de lire ce fichier Excel.');}
        input.value='';
    }; reader.readAsArrayBuffer(file);
}
</script>

</body>
</html>
